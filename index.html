<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat | Pra falar com a Beatriz</title>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Inter", sans-serif;
        }

        :root {
            font-size: 16px;
        }

        body {
            background: url(imagens/Cópia\ de\ 17\ \(part.\ Joshua\ &\ DK\ de\ SEVENTEEN\).png);
            color: #f2f2f2;
        }

        .container {
            width: 100%;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login {
            width: 100%;
            max-width: 330px;
            background-color: #f361bb;
            border-radius: 5px;
            padding: 20px;
        }

        .login>h2 {
            text-align: center;
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        .login__form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .login__input {
            border: none;
            padding: 15px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #070707;
            outline: none;
            border-radius: 5px;
        }

        .login__input:focus {
            outline: 2px solid #f2f2f2;
        }

        .login__button {
            border: none;
            padding: 15px;
            border-radius: 5px;
            font-size: 0.85rem;
            font-weight: 700;
            background-color: #ddd;
            cursor: pointer;
            color: #121212;
        }

        .login__button:hover {
            background-color: #fff;
        }

        .chat {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: space-between;
        }

        .chat__messages {
            flex-grow: 1;
            padding: 30px 30px 90px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .chat__form {
            background-color: #f8f7f8;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
        }

        .chat__input {
            border: none;
            padding: 15px;
            border-radius: 8px;
            flex-grow: 1;
            background-color: #fcfafb;
            outline: none;
            font-size: 1rem;
        }

        .chat__button {
            border: none;
            background: none;
            color: #f2f2f2;
            cursor: pointer;
        }

        .chat__button>span {
            font-size: 1.8rem;
        }

        .chat__messages>div {
            padding: 10px;
            width: 100%;
            max-width: 250px;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 15px;
            line-height: 22px;
        }

        .message--self {
            background-color: #f2f2f2;
            color: #121212;
            border-radius: 10px 10px 0 10px;
            align-self: flex-end;
        }

        .message--other {
            background-color: #333;
            color: #f2f2f2;
            border-radius: 0 10px 10px 10px;
            align-self: flex-start;
        }

        .message--sender {
            display: block;
            margin-bottom: 15px;
            font-weight: 700;
            color: cadetblue;
        }
    </style>
</head>

<body>

    <section class="container">

        <section class="login">
            <h2>Login</h2>
            <form class="login__form">
                <input type="text" class="login__input" placeholder="Seu nome" required />
                <button type="submit" class="login__button">Entrar</button>
            </form>
        </section>

        <section class="chat">
            <section class="chat__messages">

            </section>

            <form class="chat__form">
                <input type="text" class="chat__input" placeholder="Digite uma mensagem" required />
                <button type="submit" class="chat__button">
                    <span class="material-symbols-outlined">Enviar</span>
                </button>
            </form>
        </section>

    </section>

    <script src="./js/script.js"></script>
</body>
<script>

    const login = document.querySelector(".login")
    const loginForm = login.querySelector(".login__form")
    const loginInput = login.querySelector(".login__input")

    const chat = document.querySelector(".chat")
    const chatForm = chat.querySelector(".chat__form")
    const chatInput = chat.querySelector(".chat__input")
    const chatMessages = chat.querySelector(".chat__messages")

    const colors = [
        "cadetblue",
        "darkgoldenrod",
        "cornflowerblue",
        "darkkhaki",
        "hotpink",
        "gold"
    ]

    const user = { id: "", name: "", color: "" }

    let websocket

    const createMessageSelfElement = (content) => {
        const div = document.createElement("div")

        div.classList.add("message--self")
        div.innerHTML = content

        return div
    }

    const createMessageOtherElement = (content, sender, senderColor) => {
        const div = document.createElement("div")
        const span = document.createElement("span")

        div.classList.add("message--other")

        span.classList.add("message--sender")
        span.style.color = senderColor

        div.appendChild(span)

        span.innerHTML = sender
        div.innerHTML += content

        return div
    }

    const getRandomColor = () => {
        const randomIndex = Math.floor(Math.random() * colors.length)
        return colors[randomIndex]
    }

    const scrollScreen = () => {
        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        })
    }

    const processMessage = ({ data }) => {
        const { userId, userName, userColor, content } = JSON.parse(data)

        const message =
            userId == user.id
                ? createMessageSelfElement(content)
                : createMessageOtherElement(content, userName, userColor)

        chatMessages.appendChild(message)

        scrollScreen()
    }

    const handleLogin = (event) => {
        event.preventDefault()

        user.id = crypto.randomUUID()
        user.name = loginInput.value
        user.color = getRandomColor()

        login.style.display = "none"
        chat.style.display = "flex"

        websocket = new WebSocket("ws://localhost:8080")
        websocket.onmessage = processMessage
    }

    const sendMessage = (event) => {
        event.preventDefault()

        const message = {
            userId: user.id,
            userName: user.name,
            userColor: user.color,
            content: chatInput.value
        }

        websocket.send(JSON.stringify(message))

        chatInput.value = ""
    }

    loginForm.addEventListener("submit", handleLogin)
    chatForm.addEventListener("submit", sendMessage)
</script>

</html>
